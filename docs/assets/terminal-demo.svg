<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="720" height="400" rx="12" fill="url(#bg)" stroke="#30363d"/>
  <circle cx="28" cy="24" r="7" fill="#ff5f57"/>
  <circle cx="50" cy="24" r="7" fill="#febc2e"/>
  <circle cx="72" cy="24" r="7" fill="#28c840"/>
  <text x="100" y="30" fill="#8b949e" font-size="15">riscv-cpu — UART @ 115200 baud</text>
  <g fill="#c9d1d9" font-size="16">
    <text x="24" y="70">$ ./run.sh firmware_blinky.hex</text>
    <text x="24" y="98" fill="#7ee787">EBREAK observed at PC=0x00000010 LEDs=11111</text>
