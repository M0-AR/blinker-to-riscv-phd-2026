    <text x="24" y="238">      *******</text>
    <text x="24" y="260">    ***********</text>
    <text x="24" y="282">   *************</text>
    <text x="24" y="304">    ***********</text>
    <text x="24" y="326">      *******</text>
    <text x="24" y="354" fill="#8b949e">26/26 tests pass · 100% RV32I · 1180/1280 LUT</text>
